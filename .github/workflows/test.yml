name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=backend/prisma/schema

      - name: Build shared package
        run: npm -w packages/shared run build

      - name: Check module boundaries
        run: npm run lint:boundaries

      - name: Run backend tests
        run: npm -w backend run test -- --ci --forceExit --maxWorkers=2 --coverage --coverageReporters=text-summary --coverageReporters=lcov

      - name: Run frontend tests
        run: npm -w frontend run test -- --ci --forceExit

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov-report
          retention-days: 14

  build:
    # Jest only type-checks files a test imports, so compile everything too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=backend/prisma/schema

      - name: Build shared, backend and frontend
        run: npm run build
