# Stands in for the production ALB: /api/* and /docs* go to the backend,
# everything else to the frontend, all on one origin (see cloudformation.yaml).
server {
  listen 80;
  client_max_body_size 50m;

  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
  }
  location /docs {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
  }
  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
  }
}
